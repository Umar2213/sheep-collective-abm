name: Model and stored-data checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-service.txt
      - run: python -m unittest discover -s tests -v
      - name: End-to-end synthetic analysis and report
        run: |
          python src/generate_demo.py --output "$RUNNER_TEMP/analysis-demo"
          python src/run_analysis.py "$RUNNER_TEMP/analysis-demo/trajectories.csv" --config "$RUNNER_TEMP/analysis-demo/config.json" --ties "$RUNNER_TEMP/analysis-demo/ties.csv" --output "$RUNNER_TEMP/analysis-output" --sensitivity-radii 5 10
      - run: python src/verify_analysis.py "$RUNNER_TEMP/analysis-output"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-analysis-check
          path: ${{ runner.temp }}/analysis-output/
      - run: python src/audit_results.py
      - run: python src/analyze_production.py && python src/make_main_figure.py && python src/analyze_fss.py && python src/make_snapshots.py

  julia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.5'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. tests/runtests.jl
      - run: julia --project=. tests/trait_distributions.jl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate and merge actual Julia smoke shards for all experiments
        shell: bash
        env:
          ABM_SMOKE: '1'
          ABM_SHARD_COUNT: '2'
        run: |
          set -euo pipefail
          for experiment in production finite_size algorithmic_controls distribution_controls; do
            case "$experiment" in
              production) script=production_sweep.jl ;;
              finite_size) script=fss_sweep.jl ;;
              algorithmic_controls) script=control_sweep.jl ;;
              distribution_controls) script=distribution_control.jl ;;
            esac
            export ABM_OUTPUT_DIR="$RUNNER_TEMP/abm-smoke/$experiment"
            for shard in 1 2; do
              ABM_SHARD_INDEX="$shard" julia --project=. --threads=2 "src/$script"
            done
            python src/merge_shards.py --experiment "$experiment" --root "$ABM_OUTPUT_DIR"
          done
      - run: julia --project=. src/benchmark_compute.jl
        env:
          ABM_BENCHMARK_N: '12'
          ABM_BENCHMARK_STEPS: '20'
