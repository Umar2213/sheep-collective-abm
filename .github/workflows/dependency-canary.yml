name: Latest-dependency canary

# Pinned versions in requirements.txt remain the reference environment. This workflow
# runs the Python tests against current releases so incompatibilities (such as the
# pandas 3 string dtype) are found before a server or new installation picks them up.
# It does not run on pull requests and never blocks merging.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unpinned current releases
        run: pip install --upgrade numpy pandas scipy matplotlib pyproj waitress
      - run: pip freeze
      - run: python -m unittest discover -s tests -v
